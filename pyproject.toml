[project]
name = "market-monitor-gui-client"
# Single source of truth: ``__version__`` in src/market_monitor_gui/__init__.py.
# Release builds rewrite it from the git tag (scripts/set_version.py).
dynamic = ["version"]
description = "Desktop GUI client for the Market Monitor control-plane API"
readme = "README.md"
authors = [
    { email = "edyatl@yandex.ru" },
]
requires-python = ">=3.14,<3.15"
dependencies = [
    # HTTP client (prefer HTTP/2; falls back to HTTP/1.1)
    "httpx[http2]>=0.28,<1.0",
    # Settings / DTOs
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    # UI
    "customtkinter>=5.2,<6.0",
    # Fernet secret-at-rest
    "cryptography>=43.0,<47.0",
    # CA bundle for verified TLS in packaged builds
    "certifi>=2024.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2.0",
    "pyright>=1.1.414",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.11,<1.0",
    "respx>=0.21,<1.0",
    "types-certifi>=2021.10.8",
    # Packaging (scripts/build_windows.ps1); build tool only, not a runtime dependency.
    "nuitka>=4.2,<5",
]

[project.scripts]
market-monitor-gui = "market_monitor_gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/market_monitor_gui/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/market_monitor_gui"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "A",
    "C4",
    "DTZ",
    "PIE",
    "PGH",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"src/market_monitor_gui/texts/ru.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = [
    "market_monitor_gui",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.14"
strict = true
files = [
    "src",
]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_decorators = false
disallow_incomplete_defs = true
no_implicit_optional = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# CustomTkinter ships no type information, so its widget classes are ``Any``. Only the
# UI package subclasses them; keep the rest of the tree on full strict checking.
[[tool.mypy.overrides]]
module = ["market_monitor_gui.ui", "market_monitor_gui.ui.*"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "-m",
    "not e2e",
]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]
filterwarnings = [
  "ignore:.*get_event_loop_policy.*:DeprecationWarning",
  "ignore:.*set_event_loop_policy.*:DeprecationWarning",
]

